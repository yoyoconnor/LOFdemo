<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body style="margin:0">
<title>LOF Threat Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;800&family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: the 3D field is the whole page. Type floats in the four corners with no boxes: a giant LOF readout bottom-left, a text ticker on the right. Single dark, cinematic look by design. */
:root{
  --void:#05070e; --fg:#e8ecf6; --mute:rgba(232,236,246,.52); --faint:rgba(232,236,246,.22); --hair:rgba(232,236,246,.12);
  --hot:#ff5b3d; --amber:#f5b14a; --violet:#b48cff; --ice:#9fd8ff;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--fg);font-family:var(--f-mono);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
#stage canvas{display:block}
.fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:13px;padding:24px}

.hud{position:fixed;inset:0;pointer-events:none}
.lbl{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.mark{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:max(24px,env(safe-area-inset-left,0px))}
.mark h1{margin:0;font:800 22px/.9 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.mark h1 em{font-style:normal;font-weight:300;color:var(--mute)}
.hint{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));color:var(--faint);transition:opacity 1s}

.dock{position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));pointer-events:auto;
  width:min(380px,calc(100vw - 40px));display:flex;flex-direction:column-reverse}
#pill{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;align-self:flex-start;
  padding:9px 16px 9px 12px;border-radius:999px;background:rgba(12,15,28,.62);border:1px solid var(--hair);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:border-color .2s,background .2s}
#pill:hover{border-color:var(--faint)}
#pill:focus-visible{outline:1px solid var(--ice);outline-offset:2px}
#pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 10px currentColor;color:var(--ice);transition:background .3s,color .3s}
#pill .v{font:500 22px/1 var(--f-disp);font-variant-numeric:tabular-nums;min-width:3.2ch}
#pill .m{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#pill .chev{font-size:11px;color:var(--faint);transition:transform .3s}
.dock.open #pill .chev{transform:rotate(180deg)}

.panel{margin-bottom:10px;padding:18px 18px 16px;border-radius:14px;background:rgba(10,13,25,.78);border:1px solid var(--hair);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:16px;
  max-height:calc(100vh - 140px);overflow-y:auto;transform-origin:bottom left;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.dock:not(.open) .panel{opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;visibility:hidden}
.who{display:flex;gap:10px;align-items:baseline;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.who b{color:var(--fg);font-weight:500}
.verdict{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase}
.big{font:300 64px/.85 var(--f-disp);font-variant-numeric:tabular-nums;margin:4px 0 6px -2px}
.formula{font-size:11.5px;color:var(--mute);line-height:1.7}
.formula b{color:var(--fg);font-weight:400}
.why{font-size:11.5px;line-height:1.55;color:var(--mute);margin-top:6px}
.sec{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--hair);padding-top:14px}
.tally{display:flex;gap:20px}
.tally div{display:flex;flex-direction:column;gap:3px}
.tally b{font:500 20px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.tally .lbl{font-size:8.5px;letter-spacing:.16em}
#tick{list-style:none;margin:0;padding:0;max-height:150px;overflow-y:auto}
#tick li{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:11px}
#tick li:last-child{border:0}
#tick li:focus-visible{outline:1px solid var(--ice)}
#tick .h{color:var(--fg)} #tick .w{color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tick .s{font:500 15px/1 var(--f-disp);font-variant-numeric:tabular-nums}
#tick li.sel{background:rgba(232,236,246,.05)}
.inject{display:flex;flex-wrap:wrap;gap:6px}
.inject button{all:unset;cursor:pointer;font-size:10.5px;letter-spacing:.08em;color:var(--fg);padding:6px 10px;border:1px solid var(--hair);border-radius:999px;transition:border-color .2s}
.inject button kbd{font:inherit;color:var(--faint);margin-right:5px}
.inject button:hover,.inject button:focus-visible{border-color:var(--hot)}
.inject button.ben:hover,.inject button.ben:focus-visible{border-color:var(--amber)}
.tune{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.tune label{display:flex;flex-direction:column;gap:6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tune label output{color:var(--fg)}
.tune input{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;cursor:pointer}
.tune input::-webkit-slider-runnable-track{height:1px;background:var(--faint)}
.tune input::-moz-range-track{height:1px;background:var(--faint)}
.tune input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:var(--fg)}
.tune input::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--fg)}
#pause{all:unset;cursor:pointer;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--faint);padding:6px 10px;border-radius:999px}
#pause:focus-visible{outline:1px solid var(--ice)}

.gname{position:fixed;left:0;top:0;pointer-events:none;font:500 11px var(--f-disp);letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;opacity:.55}
.call{position:fixed;left:0;top:0;pointer-events:none;will-change:transform}
.call i{position:absolute;left:0;top:0;width:40px;height:1px;background:currentColor;transform-origin:0 0;transform:rotate(-38deg);opacity:.7}
.call div{position:absolute;left:32px;top:-38px;white-space:nowrap}
.call b{display:block;font:500 22px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.call span{font-size:9.5px;letter-spacing:.12em;color:var(--mute)}

.tip{position:fixed;left:0;top:0;width:340px;pointer-events:auto;z-index:6;--tc:var(--ice);will-change:transform;
  background:linear-gradient(180deg,rgba(15,19,36,.94),rgba(7,9,18,.94));border:1px solid rgba(232,236,246,.14);
  padding:14px 18px 12px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.tip::before,.tip::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--tc)}
.tip::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.tip::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.tip.pop{animation:pop .45s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{0%{opacity:0;clip-path:inset(0 0 100% 0)}60%{opacity:1}100%{clip-path:inset(0 0 0 0)}}
.tip-h{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.tip-n{font-size:10px;letter-spacing:.14em;color:var(--faint);font-variant-numeric:tabular-nums}
.tip-t{font:600 22px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.tip-b{margin:0;font-size:12.5px;line-height:1.65;color:var(--fg);min-height:4.9em}
.tip-b .car{display:inline-block;width:7px;height:13px;background:var(--tc);vertical-align:-2px;margin-left:2px;animation:car .8s steps(1) infinite}
@keyframes car{50%{opacity:0}}
.tip-b em{font-style:normal;color:var(--tc)}
.tip-f{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:9px;border-top:1px solid var(--hair)}
.tip-f button{all:unset;cursor:pointer;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#tipGo{color:var(--tc);opacity:.35;transition:opacity .3s}
#tipGo.ready{opacity:1;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#tipSkip{color:var(--faint)} #tipSkip:hover{color:var(--mute)}
.tip-f button:focus-visible{outline:1px solid var(--tc);outline-offset:3px}
#lead{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
.ret{position:fixed;left:0;top:0;width:34px;height:34px;pointer-events:none;z-index:5;color:var(--ice)}
.ret i{position:absolute;inset:0;animation:spin 6s linear infinite}
.ret i::before,.ret i::after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid currentColor}
.ret i::before{left:0;top:0;border-right:0;border-bottom:0}
.ret i::after{right:0;bottom:0;border-left:0;border-top:0}
.ret b{position:absolute;inset:-10px;border:1px solid currentColor;border-radius:50%;opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
#replay{all:unset;cursor:pointer;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--faint);align-self:flex-start}
@media (max-width:700px){.tip{width:calc(100vw - 32px)}}
@media (max-width:600px){.hint{display:none}.tune{grid-template-columns:1fr 1fr}.gname{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage" aria-label="Interactive 3D feature space. Drag to orbit, scroll to zoom."></div>

<svg id="lead" aria-hidden="true" style="display:none"><line id="leadL" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="1" opacity=".75"/><circle id="leadC" r="2.5" fill="currentColor"/></svg>
<div class="ret" id="ret" aria-hidden="true" hidden><i></i><b></b></div>
<div class="tip" id="tip" hidden role="dialog" aria-live="polite" aria-label="Story">
  <div class="tip-h"><span class="tip-n" id="tipN">01 / 12</span><span class="tip-t" id="tipT"></span></div>
  <p class="tip-b" id="tipB"></p>
  <div class="tip-f"><button type="button" id="tipGo">Continue ▸</button><button type="button" id="tipSkip">Skip story</button></div>
</div>
<div class="hud">
  <div class="mark"><h1>LOF <em>/</em> Field</h1></div>
  <div class="lbl hint" id="hint">Drag to orbit · scroll to zoom · H for panel</div>

  <div class="dock" id="dock">
    <button id="pill" type="button" aria-expanded="false" aria-controls="panel">
      <span class="dot" id="pDot"></span><span class="v" id="pLof">—</span><span class="m" id="pMeta">0 alerts</span><span class="chev">▲</span>
    </button>
    <div class="panel" id="panel" aria-live="polite">
      <div>
        <div class="who"><b id="rHost">—</b><span id="rGroup">waiting for first host-hour</span><span class="verdict" id="rVerdict"></span></div>
        <div class="big" id="rBig">0.00</div>
        <div class="formula" id="rFormula">LOF<sub>k</sub>(q) = mean lrd(o) ÷ lrd(q)</div>
        <div class="why" id="rWhy"></div>
      </div>
      <div class="sec">
        <div class="tally">
          <div><b id="sScored">0</b><span class="lbl">Scored</span></div>
          <div><b id="sAlerts" style="color:var(--hot)">0</b><span class="lbl">Alerts</span></div>
          <div><b id="sFP" style="color:var(--amber)">0</b><span class="lbl">False pos</span></div>
          <div><b id="sMiss" style="color:var(--violet)">0</b><span class="lbl">Missed</span></div>
        </div>
        <ul id="tick"></ul>
      </div>
      <div class="sec">
        <span class="lbl">Inject a host-hour</span>
        <div class="inject">
          <button type="button" data-kind="beacon"><kbd>1</kbd>Kiosk beacon</button>
          <button type="button" data-kind="exfil"><kbd>2</kbd>Exfiltration</button>
          <button type="button" data-kind="lateral"><kbd>3</kbd>Lateral sweep</button>
          <button type="button" data-kind="slow"><kbd>4</kbd>Slow &amp; low</button>
          <button type="button" class="ben" data-kind="backup"><kbd>5</kbd>Backup job</button>
        </div>
      </div>
      <div class="sec">
        <button type="button" id="replay">Replay story</button>
        <span class="lbl" id="status">Novelty mode · k <b>10</b> · τ <b>1.80</b></span>
        <div class="tune">
          <label for="k">k <output id="kOut">10</output><input id="k" type="range" min="4" max="30" value="10"></label>
          <label for="tau">τ <output id="tauOut">1.80</output><input id="tau" type="range" min="1.2" max="3.5" step="0.05" value="1.8"></label>
          <label for="rate">Rate <output id="rateOut">4/s</output><input id="rate" type="range" min="1" max="14" value="4"></label>
          <button id="pause" type="button">Pause</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div class="fail">The 3D engine could not load. Check your connection and reload.</div>');return;}

/* ================= data + LOF ================= */
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const seeded=mulberry32(7);
const gauss=(r=Math.random)=>{const u=1-r(),v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const GROUPS=[
  {id:'prx',name:'Proxy servers',prefix:'PRX',c:[5.5,3.2,1.0],s:[1.1,1.0,.9],n:60,w:.16,rgb:[.50,.58,1.0],r:.13},
  {id:'ws', name:'Workstations', prefix:'WS', c:[0,0,2.4],s:[.55,.5,.6],n:150,w:.56,rgb:[.35,.82,.95],r:.105},
  {id:'pos',name:'POS kiosks',   prefix:'POS',c:[-4.6,-2.6,-2.2],s:[.16,.14,.18],n:80,w:.28,rgb:[1.0,.80,.50],r:.06},
];
const sample=(g,r)=>g.c.map((c,i)=>c+gauss(r)*g.s[i]);
const ref=[],refG=[];GROUPS.forEach((g,gi)=>{for(let i=0;i<g.n;i++){ref.push(sample(g,seeded));refG.push(gi)}});
const N=ref.length,dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
let K=10,TAU=1.8,kd=new Float64Array(N),lrd=new Float64Array(N),gTau=2;
function fit(){const nb=[];for(let i=0;i<N;i++){const a=[];for(let j=0;j<N;j++)if(j!==i)a.push([dist(ref[i],ref[j]),j]);a.sort((x,y)=>x[0]-y[0]);nb[i]=a.slice(0,K);kd[i]=a[K-1][0];}
  for(let i=0;i<N;i++){let s=0;for(const[d,o]of nb[i])s+=Math.max(kd[o],d);lrd[i]=K/s;}
  const s=[...kd].sort((a,b)=>a-b);gTau=s[Math.floor(.98*(N-1))];}
function score(q){const a=ref.map((p,j)=>[dist(q,p),j]).sort((x,y)=>x[0]-y[0]).slice(0,K);let reach=0,m=0;for(const[d,o]of a){reach+=Math.max(kd[o],d);m+=lrd[o];}
  const lq=K/reach,mn=m/K;return{lof:mn/lq,lrdq:lq,meanN:mn,nbrs:a.map(x=>x[1]),kdq:a[K-1][0]};}
fit();
const ATT={
  beacon:{label:'Kiosk beaconing',truth:'attack',g:2,f:()=>{const c=GROUPS[2].c,kio=ref.filter((_,i)=>refG[i]===2),jx=gauss()*.04,jz=gauss()*.04;let lo=0,hi=3;
    for(let it=0;it<40;it++){const m=(lo+hi)/2;const d=Math.min(...kio.map(q=>dist([c[0]+jx,c[1]+m,c[2]+jz],q)));if(d<.5)lo=m;else hi=m;}return[c[0]+jx,c[1]+hi,c[2]+jz];}},
  exfil:{label:'Overnight exfiltration',truth:'attack',g:1,f:()=>[2.7+gauss()*.15,.4+gauss()*.15,2.4+gauss()*.2]},
  lateral:{label:'Lateral sweep',truth:'attack',g:1,f:()=>[-1+gauss()*.6,5.6+gauss()*.4,5.2+gauss()*.4]},
  slow:{label:'Slow & low intrusion',truth:'attack',g:1,f:()=>{const g=GROUPS[1];return g.c.map((c,i)=>c+(i===0?1.1:.5)*g.s[i]*(.8+Math.random()*.4))}},
  peer:{label:null,truth:'normal',g:1,f:()=>GROUPS[1].c.map((c,i)=>c+gauss()*GROUPS[1].s[i]*.45)},
  backup:{label:'Scheduled backup',truth:'benign',g:1,f:()=>[2.25+gauss()*.12,-.35+gauss()*.1,2.2+gauss()*.15]},
};

/* ================= renderer + post ================= */
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div class="fail">This browser has WebGL turned off, so the 3D field cannot render.</div>');return;}
const stage=$('stage');stage.appendChild(renderer.domElement);
const PR=Math.min(devicePixelRatio,2);renderer.setPixelRatio(PR);
const gl2=renderer.capabilities.isWebGL2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070e);
const camera=new THREE.PerspectiveCamera(42,1,.1,300);

const RTType=gl2||renderer.extensions.has('OES_texture_half_float')?THREE.HalfFloatType:THREE.UnsignedByteType;
const mkRT=(w,h,ms)=>{const o={type:RTType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter};
  if(ms&&gl2&&THREE.WebGLMultisampleRenderTarget){const t=new THREE.WebGLMultisampleRenderTarget(w,h,o);t.samples=4;return t;}return new THREE.WebGLRenderTarget(w,h,o);};
let rtMain,rtA1,rtB1,rtA2,rtB2;
const quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),quadScene=new THREE.Scene(),quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));quadScene.add(quad);
const VQ=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
const brightMat=new THREE.ShaderMaterial({uniforms:{t:{value:null},th:{value:.7}},vertexShader:VQ,fragmentShader:`uniform sampler2D t;uniform float th;varying vec2 vUv;
  void main(){vec3 c=texture2D(t,vUv).rgb;if(!(c.r>=0.&&c.g>=0.&&c.b>=0.&&c.r<1e4&&c.g<1e4&&c.b<1e4))c=vec3(0.);float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(th,th+.6,l),1.);}`,depthTest:false});
const blurMat=new THREE.ShaderMaterial({uniforms:{t:{value:null},dir:{value:new THREE.Vector2()}},vertexShader:VQ,fragmentShader:`uniform sampler2D t;uniform vec2 dir;varying vec2 vUv;
  void main(){vec3 c=texture2D(t,vUv).rgb*.227;c+=(texture2D(t,vUv+dir*1.384).rgb+texture2D(t,vUv-dir*1.384).rgb)*.316;c+=(texture2D(t,vUv+dir*3.230).rgb+texture2D(t,vUv-dir*3.230).rgb)*.070;gl_FragColor=vec4(c,1.);}`,depthTest:false});
const compMat=new THREE.ShaderMaterial({uniforms:{base:{value:null},b1:{value:null},b2:{value:null},time:{value:0},res:{value:new THREE.Vector2()},flash:{value:0}},vertexShader:VQ,
  fragmentShader:`uniform sampler2D base,b1,b2;uniform float time,flash;uniform vec2 res;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){vec2 d=vUv-.5;float r=dot(d,d);vec2 off=d*r*.012;
    vec3 c=vec3(texture2D(base,vUv+off).r,texture2D(base,vUv).g,texture2D(base,vUv-off).b);
    if(!(c.r>=0.&&c.g>=0.&&c.b>=0.&&c.r<1e4&&c.g<1e4&&c.b<1e4))c=vec3(0.);
    vec3 bl=texture2D(b1,vUv).rgb*1.1+texture2D(b2,vUv).rgb*1.6;if(!(bl.r>=0.&&bl.g>=0.&&bl.b>=0.&&bl.r<1e4))bl=vec3(0.);c+=bl;
    c+=vec3(1.,.36,.24)*flash*.10*(1.-r*2.);
    c=1.-exp(-c*1.35);
    c*=1.-r*1.25;
    c+=(h(vUv*res+fract(time)*91.)-.5)*.035;
    gl_FragColor=vec4(c,1.);}`,depthTest:false});
function pass(mat,target){quad.material=mat;renderer.setRenderTarget(target);renderer.render(quadScene,quadCam);}

/* ================= scene content ================= */

  live.instanceMatrix.needsUpdate=true;live.instanceColor.needsUpdate=true;
  comets.geometry.setDrawRange(0,nc);for(const k of['position','color','size','alpha'])ca[k].needsUpdate=true;
  beamGeo.setDrawRange(0,nb*2);beamGeo.attributes.position.needsUpdate=true;beamGeo.attributes.color.needsUpdate=true;

  // fx
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const t=f.t;
    const rise=1-Math.pow(1-Math.min(1,t/.8),3);f.pil.scale.y=f.top*rise;f.pm.uniforms.a.value=f.dead?Math.max(0,f.pm.uniforms.a.value-dt*.6):Math.min(1,t*3)*(.55+.45*Math.exp(-t*1.5));f.pm.uniforms.time.value=clock;
    const s=t<1.6?.2+t*2.2:0;f.sh.scale.setScalar(s);f.sm.opacity=Math.max(0,1-t/1.6)*.8;f.sh.visible=t<1.6;f.sh.rotation.y+=dt;
    f.ring.scale.setScalar(.3+t*3.4);f.rm.opacity=Math.max(0,1-t/2.2);
    if(f.dead&&f.pm.uniforms.a.value<=0){[f.pil,f.sh,f.ring].forEach(m=>{scene.remove(m);m.material.dispose();});f.ring.geometry.dispose();fx.splice(i,1);}}
  flash=Math.max(0,flash-dt*1.8);

  // selected k-distance circle
  if(selected&&selected.r&&selected.phase!=='fly'){kCircle.visible=true;kCircle.position.copy(selected.target);kCircle.scale.setScalar(selected.r.kdq);kCircle.quaternion.copy(camera.quaternion);}else kCircle.visible=false;

  // camera
  if(rig.idle>3&&!RM&&!ptrs.size)rig.theta+=dt*.05;
  if(rig.focusT>0){rig.focusT-=dt;if(rig.focusT<=0){rig.tGoal.copy(rig.home);rig.rGoal=27;}}
  rig.r+=(rig.rGoal-rig.r)*Math.min(1,dt*(clock<3?1.1:1.8));rig.target.lerp(rig.tGoal,Math.min(1,dt*1.4));
  camera.position.set(rig.target.x+rig.r*Math.sin(rig.phi)*Math.cos(rig.theta),rig.target.y+rig.r*Math.cos(rig.phi),rig.target.z+rig.r*Math.sin(rig.phi)*Math.sin(rig.theta));
  camera.lookAt(rig.target);camera.updateMatrixWorld();

  // render + bloom
  renderer.setRenderTarget(rtMain);renderer.render(scene,camera);
  brightMat.uniforms.t.value=rtMain.texture;pass(brightMat,rtA1);
  const blur=(a,b,w,h,n)=>{for(let k=0;k<n;k++){blurMat.uniforms.t.value=a.texture;blurMat.uniforms.dir.value.set(1/w,0);pass(blurMat,b);blurMat.uniforms.t.value=b.texture;blurMat.uniforms.dir.value.set(0,1/h);pass(blurMat,a);}};
  blur(rtA1,rtB1,rtA1.width,rtA1.height,2);
  blurMat.uniforms.t.value=rtA1.texture;blurMat.uniforms.dir.value.set(0,0);pass(blurMat,rtA2);
  blur(rtA2,rtB2,rtA2.width,rtA2.height,3);
  Object.assign(compMat.uniforms,{});compMat.uniforms.base.value=rtMain.texture;compMat.uniforms.b1.value=rtA1.texture;compMat.uniforms.b2.value=rtA2.texture;
  compMat.uniforms.time.value=clock;compMat.uniforms.flash.value=flash;pass(compMat,null);

  // overlays
  const proj=(p,el,dx=0,dy=0)=>{v.copy(p).project(camera);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
    el.style.transform=`translate(${(v.x*.5+.5)*W+dx}px,${(-v.y*.5+.5)*H+dy}px)`;el.style.opacity=vis?'':'0';};
  anchors.forEach(a=>proj(a.pos,a.el,-a.el.offsetWidth/2,-a.el.offsetHeight/2));
  for(let i=callouts.length-1;i>=0;i--){const c=callouts[i];c.t+=dt;proj(c.e.pos,c.el);
    const k=Math.min(1,c.t/.9);c.b.textContent=(c.e.r.lof*(1-Math.pow(1-k,3))).toFixed(2);
    if(!events.includes(c.e)||c.t>9){c.el.style.opacity=Math.max(0,1-(c.t-9)).toString();if(c.t>10||!events.includes(c.e)){c.el.remove();callouts.splice(i,1);}}}
  shown+=(goal-shown)*Math.min(1,dt*5);const st=shown.toFixed(2);$('rBig').textContent=st;$('pLof').textContent=selected||stats.scored?st:'—';
  story.update(dt);
  requestAnimationFrame(frame);
}
// a scripted first alert so the opening already shows a detection

/* ================= story mode ================= */
const story=(()=>{
  const tip=$('tip'),tN=$('tipN'),tT=$('tipT'),tB=$('tipB'),go=$('tipGo'),lead=$('lead'),lL=$('leadL'),lC=$('leadC'),ret=$('ret');
  const C3=g=>new THREE.Vector3(...GROUPS[g].c);
  const f2=x=>x.toFixed(2);
  const ixOf=gi=>ref.map((_,i)=>i).filter(i=>refG[i]===gi);
  const proxyGap=(()=>{const ix=ixOf(0);const d=ix.map(i=>Math.min(...ix.filter(j=>j!==i).map(j=>dist(ref[i],ref[j])))).sort((a,b)=>a-b);return d[d.length>>1];})();
  const nearestOf=(e,gi)=>Math.min(...ixOf(gi).map(i=>dist(e.q,ref[i])));
  const peersAll=(e,gi)=>e.r.nbrs.every(o=>refG[o]===gi);
  const aboveAll=(e,gi,ax)=>ixOf(gi).every(i=>e.q[ax]>ref[i][ax]);
  const medKd=gi=>{const a=[];for(let i=0;i<N;i++)if(refG[i]===gi)a.push(kd[i]);a.sort((x,y)=>x-y);return a[a.length>>1];};
  const S=[
    {t:'The network',c:'var(--ice)',cam:[null,27],
     text:()=>`Each sphere is one simulated <em>host-hour</em>: one machine, summarized over one hour. Its position is its behavior on three scaled features: outbound bytes, unique destinations, processes spawned. The faint haze only shows where hosts are dense.`},
    {t:'Proxy servers',c:'var(--prx)',at:()=>C3(0),cam:[C3(0),15],
     text:()=>`Proxies talk to many hosts, and no two hours look alike. Their cloud is <em>wide and loose</em>: the median gap between a proxy and its nearest proxy neighbor is ${f2(proxyGap)}. For a proxy, that spread is normal.`},
    {t:'POS kiosks',c:'var(--pos)',at:()=>C3(2),cam:[C3(2),10],
     text:()=>`Kiosks should only reach the payment processor and an update server. They all behave almost identically, so their cloud is <em>tight</em>: a typical kiosk finds ${K} neighbors within ${f2(medKd(2))}.`},
    {t:'The problem',c:'var(--ice)',cam:[null,30],
     text:()=>`One global rule can't serve both. A cutoff loose enough for the proxies is far too loose to notice anything inside the kiosk cloud. LOF asks a smaller question: <em>is this host unusual compared with its nearest neighbors?</em>`},
    {t:'A host-hour arrives',c:'var(--ws)',spawn:'peer',r:12,
     pre:e=>`${e.host}, a workstation, reports its hour. Watch where it lands.`,
     text:e=>`LOF finds its <em>k = ${K} nearest neighbors</em> in the fixed reference set of normal behavior (the beams). The dashed ring shows its k-distance: how far it reached to find them, ${f2(e.r.kdq)}.`},
    {t:'Density ratio',c:'var(--ws)',reuse:1,r:12,
     text:e=>`Its local density, from how far it sits from those neighbors: lrd = <em>${f2(e.r.lrdq)}</em>. Their average density: <em>${f2(e.r.meanN)}</em>. LOF is the ratio: <em>${f2(e.r.lof)}</em>. ${e.flag?`That is above τ = ${f2(TAU)}, so this normal host alerts. Ordinary hosts do that now and then.`:e.r.lof<1.3?`Close to 1 means it is about as dense as its neighbors. No alert.`:`Below τ = ${f2(TAU)}, so no alert.`}`},
    {t:'Something changes',c:'var(--hot)',spawn:'beacon',r:9,
     pre:e=>`${e.host} is a kiosk. This hour it reaches more unique destinations than any kiosk in the reference.`,
     text:e=>{const n=nearestOf(e,2),pk=medKd(0);
       return `It sits only <em>${f2(n)}</em> from its nearest kiosk, ${n<proxyGap?`closer than two neighboring proxies typically sit (${f2(proxyGap)})`:`about as far as two neighboring proxies sit (${f2(proxyGap)})`}. Its k-distance is ${f2(e.r.kdq)}${e.r.kdq<pk?`, smaller than a typical proxy's ${f2(pk)}`:''}. A global k-NN rule, cutoff ${f2(gTau)}, ${e.r.kdq>gTau?'flags it':'<em>misses it</em>'}.`;}},
    {t:'Locally isolated',c:'var(--hot)',reuse:1,r:9,
     text:e=>`Against its ${peersAll(e,2)?'kiosk ':''}neighbors, though, it stands out. On average they are <em>${f2(e.r.lof)}×</em> denser than it is. LOF = ${f2(e.r.lof)}, ${e.flag?`above τ = ${f2(TAU)}. <em>Alert raised.</em>`:`still below τ = ${f2(TAU)}. Lower τ and it would alert.`}`},
    {t:'A false alarm',c:'var(--amber)',spawn:'backup',r:12,
     pre:e=>`${e.host} starts its scheduled backup to the file server.`,
     text:e=>`It sends far more data than workstations usually do, so LOF = <em>${f2(e.r.lof)}</em>${e.flag?' and it alerts':', just under τ this time'}. LOF measures <em>difference, not intent</em>. An analyst would dismiss this in minutes.`},
    {t:'The quiet one',c:'var(--violet)',spawn:'slow',r:12,
     pre:e=>`${e.host} is compromised, and the attacker keeps its activity at normal workstation levels.`,
     text:e=>`It lands inside the workstation cloud, so LOF = <em>${f2(e.r.lof)}</em>. ${e.flag?'This time it crossed τ.':'To LOF it looks like any other workstation. <em>Missed.</em>'} An attacker who stays within peer levels is hard for any anomaly detector to see.`},
    {t:'Loud and obvious',c:'var(--hot)',spawn:'lateral',r:16,
     pre:e=>`${e.host} begins sweeping the network: many new destinations and processes at once.`,
     text:e=>`LOF = <em>${f2(e.r.lof)}</em>. ${e.r.kdq>gTau?'The global k-NN rule flags it too.':'The global k-NN rule misses it.'} Cases like this need no local comparison. LOF earns its place on <em>quiet, local</em> cases like the kiosk.`},
    {t:'Your turn',c:'var(--ice)',cam:[null,27],end:1,
     text:()=>`The stream is live now. Open the panel with <em>H</em> or the chip in the corner to inject attacks, change k, and move the threshold τ. Keys 1 to 5 inject too.`},
  ];
  const st={active:false,rate:0,i:-1,ev:null,full:'',shown:0,mode:'',px:null,py:null};
  const pad=n=>String(n).padStart(2,'0');
  function setCam(at,r){rig.tGoal.copy(at||rig.home);rig.rGoal=r;rig.focusT=0;}
  function type(html){st.full=html;st.shown=0;go.classList.remove('ready');}
  function enter(i){
    st.i=i;const s=S[i];tip.style.setProperty('--tc',s.c);ret.style.color=s.c;lead.style.color=s.c;
    tN.textContent=`${pad(i+1)} / ${pad(S.length)}`;tT.textContent=s.t;go.textContent=s.end?'Start ▸':'Continue ▸';
    tip.classList.remove('pop');void tip.offsetWidth;tip.classList.add('pop');
    if(s.spawn){const e=emit(s.spawn);if(e){e.dur=RM?.5:2.6;st.ev=e;}st.mode='pre';type(s.pre(st.ev));}
    else{if(!s.reuse)st.ev=null;st.mode='main';type(s.text(st.ev));}
    if(s.cam)setCam(s.cam[0],s.cam[1]);else if(s.reuse&&st.ev)setCam(st.ev.target,s.r);
    st.rate=i>=4?1.2:0;
  }
  function start(){
    st.active=true;pickAt=1e9;$('dock').hidden=true;tip.hidden=false;lead.style.display='';ret.hidden=false;
    rig.idle=99;st.px=null;enter(0);
  }
  function finish(){
    st.active=false;pickAt=-99;tip.hidden=true;lead.style.display='none';ret.hidden=true;$('dock').hidden=false;
    setCam(null,27);toggle(true);
  }
  function next(){
    if(!st.active)return;
    const ready=st.shown>=st.full.length;
    if(!ready){st.shown=st.full.length;return;}
    if(st.mode==='pre')return;
    if(S[st.i].end){finish();return;}
    enter(st.i+1);
  }
  // render the typed portion without breaking tags
  function partial(html,n){let out='',vis=0,i=0;while(i<html.length&&vis<n){if(html[i]==='<'){const j=html.indexOf('>',i);out+=html.slice(i,j+1);i=j+1;}else{out+=html[i++];vis++;}}
    const opens=(out.match(/<em>/g)||[]).length-(out.match(/<\/em>/g)||[]).length;return out+(opens>0?'</em>':'');}
  const visLen=h=>h.replace(/<[^>]+>/g,'').length;
  const v=new THREE.Vector3();
  function update(dt){
    if(!st.active)return;
    const tnow=performance.now();dt=Math.min(.5,(tnow-(st.t||tnow))/1000);st.t=tnow;
    const s=S[st.i];
    // pre → main once the injected host-hour has been scored
    if(st.mode==='pre'&&st.ev&&st.ev.r&&st.ev.age>.35&&st.shown>=st.full.length){
      st.mode='main';select(st.ev);setCam(st.ev.target,s.r);type(s.text(st.ev));
      tip.classList.remove('pop');void tip.offsetWidth;tip.classList.add('pop');
    }
    const total=visLen(st.full);
    if(st.shown<total)st.shown=Math.min(total,st.shown+dt*(RM?999:62));
    const done=st.shown>=total;
    if(done&&st.full.length&&st.shown!==st.full.length)st.shown=st.full.length;
    tB.innerHTML=partial(st.full,Math.floor(st.shown))+(done?'':'<span class="car"></span>');
    go.classList.toggle('ready',done&&st.mode==='main');
    // anchor
    let at=s.at?s.at():(st.ev&&(s.spawn||s.reuse))?st.ev.pos:null;
    const tw=tip.offsetWidth,th=tip.offsetHeight,narrow=W<700;
    let tx,ty,ax=null,ay=null;
    if(at){v.copy(at).project(camera);if(v.z<1){ax=(v.x*.5+.5)*W;ay=(-v.y*.5+.5)*H;}}
    if(narrow){tx=16;ty=70;}
    else if(ax==null){tx=W/2-tw/2;ty=H*.22;}
    else{tx=ax+80;ty=ay-th-60;if(tx+tw>W-24)tx=ax-80-tw;tx=Math.max(24,Math.min(W-tw-24,tx));ty=Math.max(76,Math.min(H-th-90,ty));}
    if(st.px==null){st.px=tx;st.py=ty;}
    const k=Math.min(1,dt*7);st.px+=(tx-st.px)*k;st.py+=(ty-st.py)*k;
    tip.style.transform=`translate(${st.px}px,${st.py}px)`;
    if(ax!=null){
      ret.hidden=false;ret.style.transform=`translate(${ax-17}px,${ay-17}px)`;
      const ex=narrow?st.px+tw/2:(ax<st.px?st.px:st.px+tw),ey=st.py+th;
      lL.setAttribute('x1',ax);lL.setAttribute('y1',ay);lL.setAttribute('x2',ex);lL.setAttribute('y2',ey);
      lC.setAttribute('cx',ex);lC.setAttribute('cy',ey);lead.style.display='';
    }else{ret.hidden=true;lead.style.display='none';}
  }
  go.onclick=next;tip.addEventListener('click',e=>{if(e.target===tip||e.target===tB)next();});
  $('tipSkip').onclick=()=>finish();
  return{start,finish,next,update,get active(){return st.active},get rate(){return st.rate}};
})();
$('replay').onclick=()=>{toggle(false);story.start();};
setTimeout(()=>story.start(),RM?200:2300);
requestAnimationFrame(frame);
})();
</script>
